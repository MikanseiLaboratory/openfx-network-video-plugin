[workspace]
resolver = "3"
members = ["crates/openfx", "crates/openfx-network-video-plugin"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["MikanseiLaboratory"]
repository = "https://github.com/MikanseiLaboratory/openfx-network-video-plugin"

[workspace.dependencies]
bindgen = "0.72"
openfx = { path = "crates/openfx" }
grafton-ndi = { version = "=1.0.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
